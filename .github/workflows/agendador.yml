name: Executar Live Scanner HT

on:
  schedule:
    - cron: '0 * * * *' # Liga automaticamente a cada hora cheia, 24 horas por dia, 7 dias por semana
  workflow_dispatch: # Permite o botão manual de dar o Play

permissions:
  contents: write

jobs:
  scanner-futebol:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar o projeto do Git
      uses: actions/checkout@v3

    - name: Instalar Python do Sistema
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Carregar dependencias estatisticas
      run: |
        pip install requests pandas numpy pytz

    - name: Executar Monitoramento de Alta Frequencia
      run: python scanner.py
